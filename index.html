<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>britz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #080808;
      --bg2:      #111111;
      --bg3:      #191919;
      --bg4:      #242424;
      --fg:       #F0EDE6;
      --fg2:      #C8C4BC;
      --fg3:      #888580;
      --fg4:      #4A4845;
      --accent:   #C8F135;
      --accent-dim: rgba(200,241,53,0.08);
      --accent-brd: rgba(200,241,53,0.20);
      --border:   rgba(255,255,255,0.055);
      --border2:  rgba(255,255,255,0.09);
      --border3:  rgba(255,255,255,0.14);
      --display:  'Space Grotesk', sans-serif;
      --mono:     'JetBrains Mono', monospace;
      --body:     'Inter', -apple-system, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--body);
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 24px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 80px;
    }
    nav .logo {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.3px;
    }
    nav .logo span { color: var(--fg4); }
    nav .tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--accent-brd);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .hero {
      margin-bottom: 80px;
    }
    .hero-top {
      display: flex;
      gap: 32px;
      align-items: center;
      margin-bottom: 32px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid var(--border2);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero h1 {
      font-family: var(--display);
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1.2px;
      color: var(--fg);
      line-height: 1.1;
    }
    .hero h1 .lime { color: var(--accent); }
    .hero h1 .dim { color: var(--fg4); }
    .hero p {
      color: var(--fg3);
      max-width: 600px;
      line-height: 1.7;
    }
    .hero-links {
      display: flex;
      gap: 20px;
      margin-top: 24px;
    }
    .hero-links a {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg3);
      text-decoration: none;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hero-links a:hover { color: var(--accent); }

    .stats {
      display: flex;
      gap: 40px;
      padding: 24px 0;
      border-top: 1px solid var(--border2);
      border-bottom: 1px solid var(--border2);
      margin-bottom: 64px;
    }
    .stat .val {
      font-family: var(--display);
      font-size: 26px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.5px;
    }
    .stat .lbl {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--fg4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .section-h {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 28px;
    }
    .section-h h2 {
      font-family: var(--display);
      font-size: 16px;
      font-weight: 600;
      color: var(--fg);
    }
    .section-h .count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg4);
    }
    .section-h .line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .tab {
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg3);
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }
    .tab:hover { border-color: var(--border3); color: var(--fg2); }
    .tab.active {
      background: var(--accent-dim);
      border-color: var(--accent-brd);
      color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s;
    }
    .card:hover {
      border-color: var(--border2);
      background: var(--bg3);
    }
    .card .top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .card .name {
      font-family: var(--display);
      font-size: 15px;
      font-weight: 600;
      color: var(--fg);
      text-decoration: none;
      transition: color 0.15s;
    }
    .card .name:hover { color: var(--accent); }
    .card .stars {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg4);
      white-space: nowrap;
    }
    .card .desc {
      color: var(--fg3);
      font-size: 12.5px;
      line-height: 1.65;
      margin-bottom: 16px;
    }
    .card .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }
    .badge {
      font-family: var(--mono);
      font-size: 9.5px;
      padding: 3px 9px;
      border-radius: 3px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .badge.javascript { background: rgba(240,219,79,0.1); color: #f0db4f; }
    .badge.typescript { background: rgba(49,120,198,0.1); color: #5b9bd5; }
    .badge.python { background: rgba(55,118,171,0.1); color: #5b9bd5; }
    .badge.resource { background: var(--accent-dim); color: var(--accent); }
    .badge.fork { background: rgba(255,255,255,0.04); color: var(--fg4); border: 1px solid var(--border); }
    .fork-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--fg4);
    }

    footer {
      margin-top: 100px;
      padding: 32px 0 60px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    footer .links { display: flex; gap: 24px; }
    footer .links a {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--fg4);
      text-decoration: none;
      transition: color 0.15s;
    }
    footer .links a:hover { color: var(--accent); }
    footer .copy {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--fg4);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg4); }

    @media (max-width: 700px) {
      .hero-top { flex-direction: column; align-items: flex-start; gap: 20px; }
      .hero h1 { font-size: 28px; }
      .stats { gap: 24px; flex-wrap: wrap; }
      .grid { grid-template-columns: 1fr; }
      .hero-links { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div class="wrap">

    <nav>
      <div class="logo">britz<span>.</span></div>
      <div class="tag">dev@12britz ~$</div>
    </nav>

    <section class="hero">
      <div class="hero-top">
        <div class="avatar">
          <img src="https://avatars.githubusercontent.com/u/3703613?v=4" alt="">
        </div>
        <h1>
          <span class="dim">$</span> whoami<span class="dim">;</span>
        </h1>
      </div>
      <p>
        building beautiful things for the terminal &mdash; CLIs, TUIs, AI tooling,
        and curated lists of the best stuff in open source.
      </p>
      <div class="hero-links">
        <a href="https://github.com/12britz" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
          github/12britz
        </a>
        <a href="https://www.npmjs.com/settings/12britz/packages" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          npm
        </a>
        <a href="mailto:britz.dev@proton.me">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          email
        </a>
      </div>
    </section>

    <div class="stats">
      <div class="stat">
        <div class="val" id="s-repos">--</div>
        <div class="lbl">repos</div>
      </div>
      <div class="stat">
        <div class="val" id="s-stars">--</div>
        <div class="lbl">stars</div>
      </div>
      <div class="stat">
        <div class="val" id="s-forks">--</div>
        <div class="lbl">forks</div>
      </div>
      <div class="stat">
        <div class="val" id="s-top">--<span class="dim">★</span></div>
        <div class="lbl">top repo</div>
      </div>
    </div>

    <div class="section-h">
      <h2>Projects</h2>
      <span class="count" id="proj-count"></span>
      <span class="line"></span>
    </div>

    <div class="tabs">
      <button class="tab active" data-f="all">All</button>
      <button class="tab" data-f="cli">CLI / TUI</button>
      <button class="tab" data-f="lists">Lists</button>
      <button class="tab" data-f="ai">AI / LLM</button>
      <button class="tab" data-f="fork">Forks</button>
    </div>

    <div class="grid" id="grid"></div>

    <footer>
      <div class="links">
        <a href="https://github.com/12britz" target="_blank" rel="noopener">GitHub</a>
        <a href="https://github.com/12britz/12britz.github.io" target="_blank" rel="noopener">source</a>
      </div>
      <div class="copy">&copy; 2026 &middot; britz</div>
    </footer>

  </div>

  <script>
    const repos = [
      { n: 'awesome-free-models',     s: 1408, l: null,     u: 'https://github.com/12britz/awesome-free-models',     d: 'Curated list of free AI models, APIs, and tools.',                                        c: 'lists' },
      { n: 'zcurl',                   s: 16,   l: 'JavaScript', u: 'https://github.com/12britz/zcurl',                   d: 'Beautifully colored curl alternative with box-style terminal output.',                     c: 'cli' },
      { n: 'awesome-ai-gateways',     s: 9,    l: null,     u: 'https://github.com/12britz/awesome-ai-gateways',     d: 'AI gateway tools, libraries & resources for LLM routing.',                                c: 'lists' },
      { n: 'sysview',                 s: 7,    l: 'TypeScript', u: 'https://github.com/12britz/sysview',                 d: 'Terminal system monitor — CPU, memory, disk, ports, network & processes.',                c: 'cli' },
      { n: 'awesome-computer-use',    s: 7,    l: null,     u: 'https://github.com/12britz/awesome-computer-use',     d: '139 open-source projects for AI desktop automation and computer use.',                     c: 'lists' },
      { n: 'awesome-ai-sideprojects', s: 3,    l: null,     u: 'https://github.com/12britz/awesome-ai-sideprojects', d: 'AI side project ideas, starter templates, tools & resources.',                             c: 'lists' },
      { n: 'awesome-tui',             s: 3,    l: 'Python', u: 'https://github.com/12britz/awesome-tui',             d: 'Browse awesome lists in the terminal.',                                                    c: 'cli' },
      { n: 'llmring',                 s: 3,    l: 'TypeScript', u: 'https://github.com/12britz/llmring',                 d: 'TypeScript LLM framework for building AI applications.',                                   c: 'ai' },
      { n: 'pix',                     s: 2,    l: 'Python', u: 'https://github.com/12britz/pix',                     d: 'CLI dependency solver using local AI (Ollama) for pip, npm, Maven.',                       c: 'ai' },
      { n: 'loadpilot',               s: 1,    l: 'Python', u: 'https://github.com/12britz/loadpilot',               d: 'K8s pod config optimizer with JMeter + Ollama AI recommendations.',                        c: 'ai' },
      { n: 'zgit',                    s: 1,    l: 'JavaScript', u: 'https://github.com/12britz/zgit',                    d: 'Tokyo Night-themed CLI wrapper for Git with structured visual panels.',                    c: 'cli' },
      { n: 'plight',                  s: 1,    l: 'JavaScript', u: 'https://github.com/12britz/plight',                  d: 'Pretty Lighthouse CLI tool with stunning box-style terminal output.',                      c: 'cli' },
      { n: 'kafka-look',              s: 0,    l: 'Python', u: 'https://github.com/12britz/kafka-look',              d: 'TUI for browsing and producing Kafka messages.',                                           c: 'cli' },
      { n: 'ztheme',                  s: 0,    l: 'TypeScript', u: 'https://github.com/12britz/ztheme',                  d: 'Interactive terminal theme changer — one command, any terminal.',                          c: 'cli' },
      { n: 'themer',                  s: 0,    l: 'TypeScript', u: 'https://github.com/12britz/themer',                  d: 'Interactive terminal theme changer (v1).',                                                  c: 'cli' },
      { n: 'commit-haiku',            s: 0,    l: 'Python', u: 'https://github.com/12britz/commit-haiku',            d: 'Generates haiku poetry from your git changes.',                                             c: 'cli' },
      { n: 'code-puppy-cmux-sidebar', s: 0,    l: 'Python', u: 'https://github.com/12britz/code-puppy-cmux-sidebar', d: 'Code Puppy plugin: live agent activity in the cmux sidebar.',                              c: 'ai' },
      { n: 'skillshare',              s: 1,    l: 'fork',   u: 'https://github.com/12britz/skillshare',              d: 'Sync skills across AI CLI tools with one command. Fork.',                                  c: 'fork' },
      { n: 'code_puppy',              s: 0,    l: 'fork',   u: 'https://github.com/12britz/code_puppy',              d: 'Agentic AI for writing code. Fork.',                                                        c: 'fork' },
      { n: 'Cider-Remote',            s: 0,    l: 'fork',   u: 'https://github.com/12britz/Cider-Remote',            d: 'Control Cider from iPhone/iPad. Fork.',                                                     c: 'fork' },
      { n: 'claude-code',             s: 0,    l: 'fork',   u: 'https://github.com/12britz/claude-code',             d: 'Agentic coding tool in your terminal. Fork.',                                               c: 'fork' },
      { n: 'glow',                    s: 0,    l: 'fork',   u: 'https://github.com/12britz/glow',                    d: 'Render markdown on the CLI. Fork.',                                                         c: 'fork' },
      { n: 'boot-ui',                 s: 0,    l: 'fork',   u: 'https://github.com/12britz/boot-ui',                 d: 'The missing developer UI for Spring Boot! Fork.',                                           c: 'fork' },
      { n: 'git-flex',                s: 0,    l: 'fork',   u: 'https://github.com/12britz/git-flex',                d: 'Show off your coding stats in style. Fork.',                                                c: 'fork' },
      { n: 'Top-AI-repos',            s: 0,    l: 'fork',   u: 'https://github.com/12britz/Top-AI-repos',            d: 'Top 100 most popular open source AI projects. Fork.',                                       c: 'fork' },
      { n: 'awesome',                 s: 0,    l: 'fork',   u: 'https://github.com/12britz/awesome',                 d: 'Awesome lists about all kinds of interesting topics. Fork.',                                 c: 'fork' },
    ];

    const owned = repos.filter(r => r.c !== 'fork');
    document.getElementById('s-repos').textContent = owned.length;
    document.getElementById('s-stars').textContent = owned.reduce((a, r) => a + r.s, 0);
    document.getElementById('s-forks').textContent = repos.filter(r => r.c === 'fork').length;
    document.getElementById('s-top').innerHTML = Math.max(...owned.map(r => r.s)) + '<span style="font-size:14px;color:var(--fg4);margin-left:2px;">★</span>';

    function render(f) {
      const grid = document.getElementById('grid');
      const filtered = f === 'all' ? repos : repos.filter(r => r.c === f);
      grid.innerHTML = '';
      filtered.forEach(r => {
        const cls = (r.l || 'resource').toLowerCase();
        grid.innerHTML += `
          <div class="card">
            <div class="top">
              <a href="${r.u}" class="name" target="_blank" rel="noopener">${r.n}</a>
              <span class="stars">${r.s} ★</span>
            </div>
            <div class="desc">${r.d}</div>
            <div class="foot">
              <span class="badge ${cls}">${r.l || 'resource'}</span>
              ${r.c === 'fork' ? '<span class="fork-label">fork</span>' : ''}
            </div>
          </div>
        `;
      });
      document.getElementById('proj-count').textContent = filtered.length + ' repos';
    }

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        render(t.dataset.f);
      });
    });

    render('all');
  </script>
</body>
</html>
